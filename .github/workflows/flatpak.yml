name: Test Flatpak Build

on:
  push:
    branches:
      - flatpak-test
  workflow_dispatch: # Allows manual button-click triggers in GitHub UI

jobs:
  build-flatpak:
    name: "Build Test Flatpak Bundle"
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository source files
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: flatpak-test

    # 2. Install flatpak system binary tools
    - name: Install Flatpak Host Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder ostree

    # 3. Securely set up the Flathub server references and target runtime SDKs in user-space
    - name: Setup User-Space Dependencies
      run: |
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    # 4. Invoke flatpak-builder on the host machine explicitly
    - name: Compile Application Bundle
      run: |
        flatpak-builder --user --repo=repo --install-deps-from=flathub --force-clean build-dir .flatpak/com.joystickgremlinux.JoystickGremlinUX.json
        flatpak build-bundle repo com.joystickgremlinux.JoystickGremlinUX.flatpak com.joystickgremlinux.JoystickGremlinUX

    # 5. Export the finished binary build file
    - name: Upload Test Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-flatpak-bundle
        path: com.joystickgremlinux.JoystickGremlinUX.flatpak
