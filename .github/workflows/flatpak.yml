name: Test Flatpak Build

on:
  push:
    branches:
      - flatpak-test
  workflow_dispatch: # Allows manual button-click triggers in GitHub UI

jobs:
  build-flatpak:
    name: "Build Test Flatpak Bundle"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: flatpak-test

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # FIX: Add Flathub to the system-wide level so flatpak-builder can resolve refs natively
    - name: Install Flatpak Build Requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder ostree
        sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

    - name: Flatpak Builder
      uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: com.joystickgremlinux.JoystickGremlinUX.flatpak
        manifest-path: .flatpak/com.joystickgremlinux.JoystickGremlinUX.json
        cache: false

    - name: Upload Test Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-flatpak-bundle
        path: com.joystickgremlinux.JoystickGremlinUX.flatpak
