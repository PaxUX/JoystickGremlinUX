name: Test Flatpak Build

on:
  push:
    branches:
      - flatpak-test
  workflow_dispatch: # Allows manual button-click triggers in GitHub UI

jobs:
  build-flatpak:
    name: "Build Test Flatpak Bundle"
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository source files
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: flatpak-test

    # 2. Install flatpak system binary tools
    - name: Install Flatpak Host Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder ostree

    # 3. Securely set up the Flathub server references and target runtime SDKs in user-space
    - name: Setup User-Space Dependencies
      run: |
        # FIX: Point directly to the secure dl.flathub.org repo package URL
        flatpak remote-add --user --if-not-exists flathub https://flathub.org
        flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    # 4. Move manifest to the root directory and invoke flatpak-builder natively
    - name: Compile Application Bundle
      run: |
        # Copy the json out of .flatpak to the root workspace directory
        cp .flatpak/com.joystickgremlinux.JoystickGremlinUX.json ./manifest.json
        
        # Modify the source path paths inside the root manifest copy to look locally at the current dir
        sed -i 's/"path": "\.\.\/"/"path": "\."/g' ./manifest.json
        
        # Run flatpak-builder from the project root directory
        flatpak-builder --user --repo=repo --install-deps-from=flathub --force-clean build-dir ./manifest.json
        flatpak build-bundle repo com.joystickgremlinux.JoystickGremlinUX.flatpak com.joystickgremlinux.JoystickGremlinUX

    # 5. Export the finished binary build file
    - name: Upload Test Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-flatpak-bundle
        path: com.joystickgremlinux.JoystickGremlinUX.flatpak
