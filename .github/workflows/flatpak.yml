name: Test Flatpak Build

on:
  push:
    branches:
      - flatpak-test
  workflow_dispatch: # Allows manual button-click triggers in GitHub UI

jobs:
  build-flatpak:
    name: "Build Test Flatpak Bundle"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flatpak/flatpak-builder:latest
      options: --privileged # Gives the container permission to use the ostree/sandbox filesystem mounts

    steps:
    # 1. Pull down the source repository code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: flatpak-test

    # 2. Add the Flathub remote directly inside the container environment
    - name: Initialize Flathub Remote
      run: |
        flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

    # 3. Manually call flatpak-builder using the container tools
    - name: Compile Flatpak Application Bundle
      run: |
        flatpak-builder --repo=repo --install-deps-from=flathub --force-clean build-dir .flatpak/com.joystickgremlinux.JoystickGremlinUX.json
        flatpak build-bundle repo com.joystickgremlinux.JoystickGremlinUX.flatpak com.joystickgremlinux.JoystickGremlinUX

    # 4. Save and export the compiled test package archive
    - name: Upload Test Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-flatpak-bundle
        path: com.joystickgremlinux.JoystickGremlinUX.flatpak
