name: Build and Release Flatpak

on:
  push:
    tags:
      - 'v*' # Runs automatically whenever you push a version tag like v1.0.0

jobs:
  build-flatpak:
    name: "Build Flatpak Bundle"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Flatpak Builder
      uses: flatpak/flatpak-github-actions/flatpak-builder@v1
      with:
        bundle: com.joystickgremlinux.JoystickGremlinUX.flatpak
        manifest-path: .flatpak/com.joystickgremlinux.JoystickGremlinUX.json
        cache: false

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: com.joystickgremlinux.JoystickGremlinUX.flatpak
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
